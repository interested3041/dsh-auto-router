# dsh-auto-router bundle patch: one host row over the Web or Desktop profile.
# The row name resolves from the profile's own node_modules where
# `dsh plugin --profile <profile> add <path|npm|github>` installed this package.
# Since 0.7.1 the row id is vendor-neutral (`auto-router`); the import name is
# the package name and never changed with the id.
- insert:
    - id: auto-router
      name: dsh-auto-router
      config: {}